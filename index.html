<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4A46E0">
<title>Kalaatma — Business Management System</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login">
  <div class="box">
    <div class="logo">K</div>
    <h1>Kalaatma BMS</h1>
    <p>Business Management System</p>
    <div class="fld" style="text-align:left;margin-bottom:11px">
      <label for="liEmail">Email</label>
      <input id="liEmail" type="email" placeholder="nama@kalaatma.id" autocomplete="username">
    </div>
    <div class="fld" style="text-align:left">
      <label for="liPass">Password</label>
      <input id="liPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="loginErr" role="alert"></div>
    <button class="btn block" id="loginBtn" style="margin-top:18px">Masuk</button>
    <div class="demo" id="cfgNote"></div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app">
  <aside class="sidebar">
    <div class="brandbar">
      <div class="mk">K</div>
      <div><b>Kalaatma</b><span>Management System</span></div>
    </div>
    <nav id="nav"></nav>
    <div style="margin-top:auto;padding-top:16px">
      <div class="whobox"><span class="av">A</span><div style="min-width:0"><b id="whoName">Admin</b><small id="whoMode"></small></div></div>
      <button class="navlink" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Keluar
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pgTitle">Dashboard</h1>
        <span class="sub" id="pgSub"></span>
      </div>
      <div class="right">
        <button class="iconbtn" id="bellBtn" aria-label="Notifikasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot hide" id="bellCount">0</span>
        </button>
      </div>
    </div>
    <div id="page"></div>
  </main>

  <nav class="mobnav" id="mobnav"></nav>
</div>

<!-- drawer + modals -->
<div class="drawer" id="drawer"><div class="bg" data-dclose></div><div class="sheet" id="drawerBody"></div></div>
<div class="modal" id="modal"><div class="bg" data-mclose></div><div class="box" id="modalBody"></div></div>
<div class="modal" id="invoiceModal">
  <div class="bg" data-iclose></div>
  <div class="box" style="max-width:720px">
    <div id="invoiceDoc"></div>
    <div class="acts noprint">
      <button class="btn soft" data-iclose>Tutup</button>
      <button class="btn line" id="printInv">Print</button>
      <button class="btn" id="dlInv">Unduh PDF</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
